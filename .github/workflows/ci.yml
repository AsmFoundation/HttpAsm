# =============================================================================
# CI - every gate HttpAsm has, on every push to main and every pull request.
#
# What runs, in one job on Linux x64 (the only platform for now):
#   1. The registry: specs/specs.cs extract --check. The pinned RFC files must match their
#      SHA-256, and specs/requirements.tsv must be exactly what they produce, so the registry
#      the tests name can never drift from the official documents. Then specs/generate.cs
#      --check: the tables generated from those files (HPACK, QPACK, Huffman, the known
#      fields' perfect hash) must match the committed ones.
#   2. dotnet build HttpAsm.slnx -c Release: the core, libhttpasm.so and the tests.
#      AsmFoundation.Sdk's bundled toolchain (NASM, lld, from nuget.org) assembles and links on
#      this runner, as it does on Windows and macOS.
#   3. The tests, through tests/run-linux.sh with the native runner, exactly as they run on a
#      developer's machine:
#      - the .NET suite at every CPU tier the runner's CPU has (HTTPASM_CPU=v1, v2, v3, and v4
#        when it has AVX-512), each on epoll and then with every server asking for io_uring;
#      - tests/native/tiers: every multi-version routine at every tier against oracles and
#        guard pages, natively, and under Intel SDE (AVX-512) when the CPU has no AVX-512.
#      HTTPASM_REQUIRE_LINUX=1: a native test that would skip fails instead, so nothing passes
#      by not running. h2spec and Intel SDE come from tests/tools.sh, pinned by version and
#      SHA-256; h2spec's 146 cases are required. HTTPASM_REQUIRE_URING=1: the runner's kernel
#      has io_uring, so a server that asks for it and silently falls back to epoll fails the
#      run. Runner kernels differ in whether they charge rings to RLIMIT_MEMLOCK (8 MiB
#      there; upstream b59cabf9b4ac reverted the charge, and backports reach kernels at
#      different times): RingBudgetTests asks the kernel and checks the library follows it,
#      and tests/native/fallback refuses io_uring with seccomp, deterministically.
#   4. tests/coverage/run.sh: the Coverage build (every block and branch edge marked by
#      tests/coverage/instrument.cs), the same runs as step 3 against it, and the report - for
#      now report-only, until tests/coverage/unreachable.tsv and the tests make the gate pass.
#   5. tests/fuzz/run.sh: each fuzzer for 30 s with libFuzzer, AddressSanitizer and
#      UndefinedBehaviorSanitizer, steered by the assembly's own branch edges. A finding fails
#      the run and is printed in base64, so the log alone reproduces it.
#   6. benchmarks/micro and benchmarks/rivals: single-thread measurements of the multi-version
#      routines at every tier, and of the parsers beside picohttpparser, llhttp and nghttp2,
#      written to the job summary with the runner's CPU. Informational: a shared runner is no
#      measuring machine, but it is where AVX-512 versions get timed when the runner has it.
#
# Supply chain: every action is pinned to a full commit SHA (the tag in the comment is for
# humans), the same pins as GrpcAsm's and AsmSdk's workflows. The token is read-only, and the
# checkout keeps no credentials.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref; a newer push to the same pull request cancels the older run, but pushes
  # to main always finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Registry, build and tests (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HTTPASM_REQUIRE_LINUX: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out HttpAsm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Registry matches the pinned official documents
        run: dotnet run specs/specs.cs -- extract --check

      - name: Generated tables match the pinned official documents
        run: dotnet run specs/generate.cs -- --check

      - name: Build (core, libhttpasm.so, tests)
        run: dotnet build HttpAsm.slnx -c Release

      - name: The runner's CPU
        run: |
          grep -m1 'model name' /proc/cpuinfo
          echo "AVX-512: $(grep -m1 -o -w -E 'avx512[a-z_0-9]*' /proc/cpuinfo | sort -u | tr '\n' ' ')"

      - name: Tests - every CPU tier on both backends; the tier program natively and under Intel SDE
        env:
          HTTPASM_RUNNER: native
        run: bash tests/run-linux.sh Release

      - name: Coverage - every block and branch edge of libhttpasm.so under every test (report only, to the job summary)
        env:
          HTTPASM_RUNNER: native
        # The runs' output goes to coverage.md with the report, so a failure prints what failed
        # (xunit's [FAIL] blocks, and the end of the file) before the step ends: without it, a
        # failing run in the Coverage build showed nothing but its exit status.
        run: |
          status=0
          bash tests/coverage/run.sh --report-only > coverage.md || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::the coverage run failed with $status"
            grep -n -E '\[FAIL\]' -A 25 coverage.md | head -300 || true
            tail -60 coverage.md
            exit "$status"
          fi
          { echo "### Coverage of libhttpasm.so"; echo; sed -n '/^Coverage of/,/^Not run/p' coverage.md | sed '$d'; tail -1 coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          tail -1 coverage.md

      - name: Fuzzing tools - clang with libFuzzer
        # The runner image's clang may come without its sanitizer runtimes (libclang-rt-*-dev);
        # a probe link says, and only then is the package installed for that clang's major.
        run: |
          clang --version | head -1
          probe="$RUNNER_TEMP/probe"
          printf 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n) { (void)d; (void)n; return 0; }\n' > "$probe.c"
          if ! clang -fsanitize=fuzzer,address,undefined "$probe.c" -o "$probe" 2>/dev/null; then
            major="$(clang -dumpversion | cut -d. -f1)"
            sudo apt-get update -q
            sudo apt-get install -y -q "libclang-rt-$major-dev"
            clang -fsanitize=fuzzer,address,undefined "$probe.c" -o "$probe"
          fi

      - name: Fuzzing - each fuzzer 30 s at every CPU tier (a finding fails the run)
        env:
          HTTPASM_RUNNER: native
        run: bash tests/fuzz/run.sh 30

      - name: Single-thread measurements per tier (informational, to the job summary)
        run: |
          bin="$(bash tests/native/build.sh Release)"
          {
            echo "### benchmarks/micro on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo
            "$bin/micro" 21
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: The parsers beside picohttpparser, llhttp and nghttp2 (informational, to the job summary)
        env:
          HTTPASM_RUNNER: native
        run: |
          {
            echo "### benchmarks/rivals on $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2-)"
            echo
            bash benchmarks/rivals/run.sh 21
          } | tee -a "$GITHUB_STEP_SUMMARY"
