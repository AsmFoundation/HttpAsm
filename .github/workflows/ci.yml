# =============================================================================
# CI - every gate HttpAsm has, on every push to main and every pull request.
#
# What runs, in one job on Linux x64 (the only platform for now):
#   1. The registry: specs/specs.cs extract --check. The pinned RFC files must match their
#      SHA-256, and specs/requirements.tsv must be exactly what they produce, so the registry
#      the tests name can never drift from the official documents. Then specs/generate.cs
#      --check: the tables generated from those files (HPACK, QPACK, Huffman, the known
#      fields' perfect hash) must match the committed ones.
#   2. dotnet build HttpAsm.slnx -c Release: the core, libhttpasm.so and the tests.
#      AsmFoundation.Sdk's bundled toolchain (NASM, lld, from nuget.org) assembles and links on
#      this runner, as it does on Windows and macOS.
#   3. The tests, natively, with HTTPASM_REQUIRE_LINUX=1: a native test that would skip fails
#      instead, so nothing passes by not running. h2spec (HTTP/2 conformance, 146 cases) comes
#      from tests/tools.sh, pinned by version and SHA-256, and HTTPASM_REQUIRE_H2SPEC=1 makes
#      Http2Tests.PassesH2spec fail rather than skip if it were missing. The tests run twice:
#      on io_uring (HTTPASM_REQUIRE_URING=1: the runner's kernel has it, so a silent fall back
#      to epoll fails), then with every server asking for epoll (HTTPASM_TEST_IO=epoll).
#
# Supply chain: every action is pinned to a full commit SHA (the tag in the comment is for
# humans), the same pins as GrpcAsm's and AsmSdk's workflows. The token is read-only, and the
# checkout keeps no credentials.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref; a newer push to the same pull request cancels the older run, but pushes
  # to main always finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Registry, build and tests (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HTTPASM_REQUIRE_LINUX: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Check out HttpAsm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Registry matches the pinned official documents
        run: dotnet run specs/specs.cs -- extract --check

      - name: Generated tables match the pinned official documents
        run: dotnet run specs/generate.cs -- --check

      - name: Build (core, libhttpasm.so, tests)
        run: dotnet build HttpAsm.slnx -c Release

      - name: Test tools (h2spec 2.6.0, pinned by SHA-256)
        run: echo "HTTPASM_H2SPEC=$(bash tests/tools.sh)/h2spec" >> "$GITHUB_ENV"

      - name: Tests on io_uring (Linux, h2spec and io_uring required)
        env:
          HTTPASM_REQUIRE_H2SPEC: "1"
          HTTPASM_REQUIRE_URING: "1"
        run: dotnet test --project tests/HttpAsm.Tests/HttpAsm.Tests.csproj -c Release --no-build

      - name: Tests on epoll (every server asks for it)
        env:
          HTTPASM_REQUIRE_H2SPEC: "1"
          HTTPASM_TEST_IO: epoll
        run: dotnet test --project tests/HttpAsm.Tests/HttpAsm.Tests.csproj -c Release --no-build
